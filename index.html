<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" id="login-container">
        <h1 class="text-center">Вхід</h1>

        <form id="login-form">
            <div class="mb-3">
                <label for="login-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="login-email" required>
            </div>
            <div class="mb-3">
                <label for="login-password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="login-password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Увійти</button>
        </form>

        <div class="mt-3">
            <p>Немає акаунту? <a href="#" id="register-link">Зареєструватися</a></p>
        </div>
    </div>

    <div class="container mt-5" id="task-container" style="display: none;">
        <h1 class="text-center">Список завдань</h1>

        <div class="mb-3">
            <input type="text" id="search-input" class="form-control" placeholder="Пошук задач..." />
        </div>

        <div id="task-list" class="mt-4">
            <!-- Завдання будуть додаватися сюди за допомогою JavaScript -->
        </div>

        <button id="add-task-button" class="btn btn-primary mt-4" data-bs-toggle="modal" data-bs-target="#addTaskModal">
            Додати задачу
        </button>
    </div>

    <!-- Модальне вікно для додавання задачі -->
    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addTaskModalLabel">Додати задачу</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
                </div>
                <div class="modal-body">
                    <form id="add-task-form">
                        <div class="mb-3">
                            <label for="task-title" class="form-label">Назва задачі</label>
                            <input type="text" class="form-control" id="task-title" required>
                        </div>
                        <div class="mb-3">
                            <label for="task-description" class="form-label">Опис задачі</label>
                            <textarea class="form-control" id="task-description" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрити</button>
                    <button type="submit" class="btn btn-primary" id="save-task-button">Додати задачу</button>
                </div>
            </div>
        </div>
    </div>

   <!-- Форма для реєстрації -->
<div class="container mt-5" id="register-container" style="display: none;">
    <h1 class="text-center">Реєстрація</h1>
    <form id="register-form">
        <div class="mb-3">
            <label for="register-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="register-email" required>
        </div>
        <div class="mb-3">
            <label for="register-password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="register-password" required>
        </div>
        <div class="mb-3">
            <label for="register-username" class="form-label">Username</label>
            <input type="text" class="form-control" id="register-username" required>
        </div>
        <button type="submit" class="btn btn-primary">Зареєструватися</button>
    </form>
    <div class="mt-3">
        <p>Вже є акаунт? <a href="#" id="login-link">Увійти</a></p>
    </div>
</div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Перехід на форму реєстрації
        document.getElementById('register-link').addEventListener('click', () => {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('register-container').style.display = 'block';
        });
    
        // Перехід на форму входу
        document.getElementById('login-link').addEventListener('click', () => {
            document.getElementById('register-container').style.display = 'none';
            document.getElementById('login-container').style.display = 'block';
        });

        async function loadTasks(searchQuery = '') {
            try {
                const response = await fetch('http://127.0.0.1:3000/tasks', {
                    method: 'GET',
                    credentials: 'include' 
                });
                const tasks = await response.json();

                const taskList = document.getElementById('task-list');
                taskList.innerHTML = ''; 

                if (tasks.length > 0) {
                    const filteredTasks = tasks.filter(task => {
                        return task.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               task.description.toLowerCase().includes(searchQuery.toLowerCase());
                    });

                    filteredTasks.forEach(task => {
                        const taskItem = document.createElement('div');
                        taskItem.classList.add('card', 'mb-2');

                        const cardBody = document.createElement('div');
                        cardBody.classList.add('card-body');

                        const taskTitle = document.createElement('h5');
                        taskTitle.classList.add('card-title');
                        taskTitle.textContent = task.title;

                        const taskDesc = document.createElement('p');
                        taskDesc.classList.add('card-text');
                        taskDesc.textContent = task.description;

                        const taskStatus = document.createElement('p');
                        taskStatus.classList.add('text-muted');
                        taskStatus.innerHTML = task.status
                            ? '<span class="text-success"><s>Виконано</s> ✅</span>'
                            : 'Не виконано';

                        const statusButton = document.createElement('button');
                        statusButton.classList.add('btn', 'btn-info', 'mt-2');
                        statusButton.textContent = task.status ? 'Позначити як не виконано' : 'Позначити як виконано';
                        statusButton.addEventListener('click', async () => {
                            try {
                                const updatedTask = {
                                    ...task,
                                    status: !task.status, 
                                };
                                const response = await fetch(`http://localhost:3000/tasks/${task.id}`, {
                                    method: 'PUT',
                                    headers: {
                                        'Content-Type': 'application/json',
                                    },
                                    body: JSON.stringify(updatedTask),
                                });
                                const result = await response.json();
                                if (response.ok) {
                                    task.status = result.status; 
                                    taskStatus.innerHTML = task.status
                                        ? '<span class="text-success"><s>Виконано</s> ✅</span>'
                                        : 'Не виконано';
                                    statusButton.textContent = task.status ? 'Позначити як не виконано' : 'Позначити як виконано';
                                }
                            } catch (error) {
                                console.error("Error updating task status:", error);
                            }
                        });

                        cardBody.appendChild(taskTitle);
                        cardBody.appendChild(taskDesc);
                        cardBody.appendChild(taskStatus);
                        cardBody.appendChild(statusButton);
                        taskItem.appendChild(cardBody);
                        taskList.appendChild(taskItem);
                    });
                }
            } catch (error) {
                console.error('Помилка завантаження задач:', error);
            }
        }

        // Форма для входу
        document.getElementById('login-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password }),
                credentials: 'include' 
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'Вхід успішний') {
                
                    document.getElementById('login-container').style.display = 'none';
                    document.getElementById('task-container').style.display = 'block';
                    loadTasks(); 
                } else {
                    alert('Невірний email або пароль');
                }
            })
            .catch(error => {
                console.error('Помилка входу:', error);
            });
        });

        // Форма для реєстрації
        document.getElementById('register-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const username = document.getElementById('register-username').value;

            fetch('http://localhost:3000/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password, username }) 
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'Користувача зареєстровано') {
                    alert('Реєстрація успішна');
                    document.getElementById('register-container').style.display = 'none';
                    document.getElementById('login-container').style.display = 'block';
                } else {
                    alert('Помилка реєстрації');
                }
            })
            .catch(error => {
                console.error('Помилка реєстрації:', error);
            });
        });
        window.onload = function () {
    fetch('http://localhost:3000/check-session', { credentials: 'include' })
        .then(response => response.json())
        .then(data => {
            if (data.isAuthenticated) {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('task-container').style.display = 'block';
                loadTasks();
            } else {
                document.getElementById('login-container').style.display = 'block';
                document.getElementById('task-container').style.display = 'none';
            }
        })
        .catch(error => {
            console.error('Помилка перевірки сесії:', error);
        });
};

        window.onload = function () {
            fetch('http://localhost:3000/check-session', {credentials: 'include'})
                .then(response => response.json())
                .then(data => {
                    if (data.isAuthenticated) {
                        document.getElementById('login-container').style.display = 'none';
                        document.getElementById('task-container').style.display = 'block';
                        loadTasks();
                    }
                })
                .catch(error => {
                    console.error('Помилка перевірки сесії:', error);
                });
        }
    </script>
</body>
</html>
